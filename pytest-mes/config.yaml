# 被测环境
base_url: http://localhost:9090
# 20 并发的锁定用例在 2 核 CI runner 上单个请求会排队到 10s 以上（ReadTimeout），放宽到 30s
timeout: 30

# 登录账号（需具备 user:add 权限，admin 默认具备）
login:
  username: admin
  password: "123"

# 数据库（用于造数据与落库校验）
db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  database: sparchetype
